name: Repository Heartbeat

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript runner
        run: npm install --no-save typescript tsx

      - name: Generate heartbeat
        run: npx tsx .github/scripts/heartbeat.ts

      - name: Configure Git
        run: |
          git config user.name "joeswrld"
          git config user.email "codexpress200@gmail.com"

      - name: Commit heartbeat
        run: |
          git add heartbeat.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: repository heartbeat update"
          git push