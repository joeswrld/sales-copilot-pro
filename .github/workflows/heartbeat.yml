name: Repository Heartbeat

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript runner
        run: npm install --no-save typescript tsx

      - name: Generate heartbeat
        run: |
          npx tsx .github/scripts/heartbeat.ts

          echo "================================"
          echo "Generated heartbeat:"
          echo "================================"

          cat heartbeat.md

      - name: Configure Git
        run: |
          git config user.name "joeswrld"
          git config user.email "codexpress200@gmail.com"

      - name: Commit heartbeat
        run: |
          git add heartbeat.md

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: repository heartbeat update"

      - name: Push heartbeat
        run: |
          git push origin HEAD:main