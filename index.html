    <!-- ── Structured data (schema.org) — helps search engines and AI
         systems parse what Fixsense actually is and does. Keep this in
         sync with reality; do not add ratings/review counts here unless
         they are real and verifiable — fake ones hurt trust signals and
         can get the site penalized. ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Fixsense",
      "url": "https://fixsense.com.ng/",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-powered sales intelligence and coaching platform. Fixsense hosts live sales calls, transcribes them in real time, and runs AI analysis to surface sentiment, objections, talk ratio, deal risk, and next-best-action recommendations for sales teams.",
      "featureList": [
        "Live video/audio sales calls",
        "Real-time call transcription",
        "Post-call AI analysis (sentiment, objections, talk ratio)",
        "Team collaboration and shared call review",
        "Pipeline health scoring",
        "Automated follow-up email drafting"
      ],
      "publisher": {
        "@type": "Organization",
        "name": "Fixsense",
        "url": "https://fixsense.com.ng/"
      }
    }
    </script>

  <body>
    <div id="root"></div>

    <!-- Fallback content for crawlers and AI agents that do not execute
         JavaScript (this app is a client-rendered SPA). Keep this
         description accurate and in sync with the live product — this
         is what most AI/LLM crawlers will actually "read". -->
    <noscript>
      <main style="max-width:720px;margin:2rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;line-height:1.6;">
        <h1>Fixsense — AI Sales Call Intelligence & Coaching</h1>
        <p>
          Fixsense is a sales intelligence platform that hosts live sales
          calls, transcribes them in real time, and uses AI to analyze
          every conversation. It surfaces sentiment, objections, talk
          ratio, deal risk, and next-best-action recommendations, and
          gives sales teams a pipeline health score so they can see where
          deals are strong or at risk.
        </p>
        <h2>What it does</h2>
        <ul>
          <li>Live video and audio sales calls with real-time transcription</li>
          <li>Automatic post-call AI analysis: sentiment, objections, talk ratio, engagement score</li>
          <li>Team collaboration on call review and shared feedback</li>
          <li>Pipeline health scoring across win rate, sentiment, activity, and call quality</li>
          <li>AI-drafted follow-up emails based on call content</li>
        </ul>
        <p>Learn more at <a href="https://fixsense.com.ng/">fixsense.com.ng</a>.</p>
      </main>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[PWA] SW registered:', reg.scope);
            })
            .catch((err) => {
              console.warn('[PWA] SW registration failed:', err);
            });
        });
      }
    </script>

  </body>
</html>
